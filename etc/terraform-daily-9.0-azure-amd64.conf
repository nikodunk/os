# target architecture
ARCH="amd64"

# base codename
BASECODENAME="resolute"

# base version
BASEVERSION="26.04"

# distribution codename
CODENAME="tanit"

# distribution version
VERSION="9.0"

# distribution channel
CHANNEL="daily"

# distribution name
NAME="elementary OS"

# mirror to fetch packages from
MIRROR_URL="http://azure.archive.ubuntu.com/ubuntu/"

# use HWE kernel and packages?
HWE_KERNEL="yes"
HWE_X11="no"

# suffix for generated .iso files
OUTPUT_SUFFIX=""

# generate installer ISO from bootc image via bootc-image-builder
BUILD_ISO="true"

# container registry and image name (for bootc image push)
REGISTRY="ghcr.io"
IMAGE_NAME="elementary/os"
